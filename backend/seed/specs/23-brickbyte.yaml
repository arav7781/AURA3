stage: seed
hq: {city: Gurugram, state: Haryana}
founded_year: 2023
one_liner: Weekly drone scans compared with BIM models to track construction progress and catch deviations early
description: >-
  BrickByte flies drones over construction sites every week, turns the imagery into 3D models and compares them
  with the project's BIM model and schedule, so developers and lenders see progress, deviations and quantities
  without relying on manual site reports. It has 23 developer and contractor customers across 61 active sites
  at Rs 18,000 per site per month, for an ARR of Rs 1.3 crore.
