domain: B2B SaaS
sub_domain: Legal AI for contract review
stage: seed
hq: {city: New Delhi, state: Delhi}
founded_year: 2024
one_liner: AI contract review tuned to Indian law, for mid-size law firms and their corporate clients
description: >-
  Nyaya AI reviews commercial contracts against a firm's own playbooks and Indian law, such as the Indian
  Contract Act, 1872 and state stamp laws, flags risky clauses and drafts redlines inside Microsoft Word. 38 law
  firms pay for 330 lawyer seats at Rs 2,400 a seat per month, for an ARR of Rs 0.95 crore.
founder_account: {email: founder@nyaya-ai.demo, name: Tanvi}
