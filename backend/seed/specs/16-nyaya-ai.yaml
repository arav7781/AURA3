    directors: [Tanvi Agarwal, Rajat Bhardwaj, Sana Mirza]
    incorporation_year: 2024
    state: Delhi
team:
  - {name: Tanvi Agarwal, role: "Co-founder & CEO", background: "7 years as an M&A associate at a large Indian law firm"}
  - {name: Rajat Bhardwaj, role: "Co-founder & CTO", background: "NLP engineer; built document-understanding models for banks"}
  - {name: Sana Mirza, role: "Co-founder, Legal Knowledge", background: "LL.M.; built clause libraries for a legal publisher"}
problem:
  statement: >-
    Junior lawyers spend most of their time on first-pass contract review, and global legal-AI tools miss
    India-specific issues such as stamp duty and enforceability.
  stats:
    - {claim: "Junior associates spend 40-60% of their time on first-pass contract review", kind: company_estimate}
    - {claim: "Global legal-AI tools are trained mostly on US and UK law", kind: company_estimate}
    - {claim: "Mid-size firms bill fixed fees for routine contracts, so review time comes out of their margin", kind: company_estimate}
solution:
  summary: An India-first contract-review copilot that applies each firm's playbook and drafts redlines.
  bullets:
    - "Clause extraction and risk flags against firm-specific playbooks"
    - "Checks for Indian-law issues: stamp duty, governing law, enforceability, arbitration seats"
    - "Suggested redlines and comments inside Microsoft Word"
    - "Firm data kept in an India-hosted, single-tenant environment"
market:
  tam: {value: 2300, unit: INR crore, year: 2025, scope: "Legal technology for Indian law firms and in-house legal teams", kind: company_estimate}
  sam: {value: 420, unit: INR crore, year: 2025, scope: "Contract-heavy law firms and corporate legal teams", kind: company_estimate}
  som: {value: 15, unit: INR crore, year: 2029, scope: 3-year obtainable share of SAM, kind: company_forecast}
