    - {pct: 30, title: "8,000 paying stores", criteria: "8,000 paying stores", due_days: 300}
    - {pct: 30, title: "Rs 3.5 crore ARR", criteria: "ARR of Rs 3.5 crore", due_days: 600}
risks:
