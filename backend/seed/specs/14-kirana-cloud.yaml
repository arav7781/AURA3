  - {name: Vyapar, positioning: "Billing, inventory and accounting app for small businesses"}
  - {name: Paper bahi-khata, positioning: "Free, familiar and still the default"}
moat:
  - Credit-ledger data creates switching costs for stores and their customers
  - Field network of 60 local agents in East India
gtm:
  channels: [Local field agents, FMCG distributor partnerships, Store-to-store referrals]
  target: 12,000 paying stores within 24 months
round:
  ask_inr: 80000000
  pre_money_inr: 450000000
  min_raise_pct: 60
  use_of_funds:
