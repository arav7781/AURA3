  cin: U86909TG2021PTC152794
  registry:
    status: ACTIVE
    registered_name: MEDISCAN DIAGNOSTICS PRIVATE LIMITED
    directors: [Sneha Reddy, Arjun Varma, Priyanka Das]
    incorporation_year: 2021
    state: Telangana
team:
  - {name: Sneha Reddy, role: "Co-founder & CEO", background: "Radiologist (MD); 9 years at tertiary-care hospitals in Hyderabad"}
  - {name: Arjun Varma, role: "Co-founder & CTO", background: "Computer-vision engineer; 6 years in medical-imaging AI"}
  - {name: Priyanka Das, role: "Co-founder, Regulatory & Quality", background: "Quality and regulatory manager at a medical-device maker"}
problem:
  statement: >-
    Radiology queues are read first-in, first-out, so a scan with a life-threatening finding can wait hours behind
    routine studies, especially at night.
  stats:
    - {claim: "Reporting backlogs of 6-24 hours are common at mid-size Indian hospitals", kind: company_estimate}
    - {claim: "Night-time CT reads are often outsourced to teleradiology at Rs 150-400 per study", kind: company_estimate}
    - {claim: "Critical findings wait in the same queue as routine scans", kind: company_estimate}
solution:
  summary: AI that reads every scan on arrival and reorders the worklist so critical cases are reported first.
  bullets:
    - "Detects pneumothorax, pleural effusion and nodules on chest X-rays"
    - "Flags suspected intracranial bleeds on non-contrast head CTs"
    - "Integrates with hospital PACS and RIS; no new screens for radiologists"
    - "Alerts the on-call radiologist by app and SMS within minutes"
market:
