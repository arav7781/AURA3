schema: aura.seed.startup/v1
slug: mediscan-diagnostics
name: MediScan Diagnostics
legal_name: MediScan Diagnostics Private Limited
domain: Healthtech
sub_domain: AI radiology triage
stage: series_a
hq: {city: Hyderabad, state: Telangana}
founded_year: 2021
one_liner: AI triage for chest X-rays and head CTs that moves critical findings to the top of the radiologist's worklist
description: >-
  MediScan's software reads chest X-rays and non-contrast head CTs as they leave the scanner and pushes
  suspected critical findings, such as pneumothorax or intracranial bleeds, to the top of the radiologist's
  worklist. It is live in 7 hospitals in Telangana and Andhra Pradesh, reads about 52,000 scans a month and has
  an ARR of Rs 2.6 crore. Its CDSCO medical-device licence has been applied for and is still pending.
