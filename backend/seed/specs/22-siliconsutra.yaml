name: SiliconSutra
legal_name: SiliconSutra Private Limited
domain: Deeptech & AI
sub_domain: RISC-V edge-AI chips
stage: pre_seed
hq: {city: Bengaluru, state: Karnataka}
founded_year: 2025
one_liner: Low-power RISC-V vision chip for on-device AI in cameras, drones and factory sensors
description: >-
  SiliconSutra is designing a RISC-V system-on-chip with a custom neural-network accelerator that runs object
  detection on cameras and sensors at under 1 watt. It is pre-revenue: the design runs on an FPGA prototype,
  three device makers have signed non-binding letters of intent, a multi-project-wafer tape-out is planned for
  late 2027, and volume production is unlikely before 2029.
