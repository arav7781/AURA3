problem:
  statement: >-
    Indian camera, drone and industrial-sensor makers import their AI chips or send video to the cloud, which is
    costly, power-hungry and raises supply-chain and privacy risks.
  stats:
    - {claim: "Most Indian camera and drone makers rely on imported AI vision chips", kind: company_estimate}
    - {claim: "Cloud video analytics costs Rs 300-800 per camera per month in bandwidth and compute", kind: company_estimate}
    - {claim: "Edge-AI modules priced above USD 100 are too costly for mass-market devices", kind: company_estimate}
solution:
  summary: An open-ISA vision chip that runs modern detection models on-device at under 1 watt.
  bullets:
    - "RISC-V cores plus a custom INT8 neural-network accelerator"
    - "Runs object detection at 30 frames per second under 1 watt (FPGA-measured, scaled estimate)"
    - "Compiler toolchain that imports standard PyTorch and ONNX models"
    - "Target price under USD 12 per chip at volume"
