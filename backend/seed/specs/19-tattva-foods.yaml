  - Strong ranking in quick-commerce search for healthy snacks
gtm:
  channels: [Quick-commerce apps, Own website, Modern-trade chains, Corporate cafeterias]
  target: Rs 12 crore annual revenue across 15 cities within 24 months
round:
  ask_inr: 60000000
  pre_money_inr: 300000000
  min_raise_pct: 60
  use_of_funds:
    - {category: Marketing, pct: 40}
    - {category: Manufacturing capacity, pct: 25}
    - {category: Working capital, pct: 20}
    - {category: Team, pct: 15}
  tranches:
    - {pct: 40, title: Round close}
