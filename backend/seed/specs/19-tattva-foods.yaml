  highlights:
    - "Live on three quick-commerce apps in 9 cities"
    - "FY2026 revenue Rs 4.1 crore, up from Rs 2.6 crore in FY2025"
    - "68% of revenue from quick-commerce"
    - "34% of website customers buy again within 60 days"
