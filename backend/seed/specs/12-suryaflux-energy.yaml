one_liner: Zero-capex rooftop solar and battery storage for MSME factories under 15-year power-purchase agreements
description: >-
  SuryaFlux designs, finances and operates rooftop solar and battery systems on MSME factory roofs and sells
  the power under 15-year PPAs at Rs 5.4 per kWh, below typical industrial grid tariffs, so owners pay no
  upfront capex. It has 21 MWp operating across 164 MSME sites in Gujarat and Maharashtra, 48 of them with
  battery storage, and annualised revenue of Rs 15.9 crore in FY2026.
