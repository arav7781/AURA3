schema: aura.seed.startup/v1
slug: neocredit-score
name: NeoCredit Score
legal_name: NeoCredit Score Private Limited
domain: Fintech
sub_domain: Alternative-data credit scoring
stage: seed
hq: {city: Gurugram, state: Haryana}
founded_year: 2023
one_liner: Alternative-data credit scores for thin-file borrowers, sold to lenders per score pulled
description: >-
  NeoCredit Score scores borrowers with little or no bureau history using consented phone, utility-bill and UPI
  cash-flow data, and sells the score to lenders through an API. The company says it works with "leading bank
  partners" but does not name them; paid usage so far is two NBFC pilots, about 41,000 scores sold and an ARR
  of Rs 0.35 crore.
founder_account: {email: founder@neocredit-score.demo, name: Rahul}
mca:
  cin: U66190HR2023PTC112375
  registry:
    status: ACTIVE
    registered_name: NEOCREDIT SCORE PRIVATE LIMITED
    directors: [Rahul Khanna, Divya Iyer, Aman Gupta]
    incorporation_year: 2023
    state: Haryana
team:
  - {name: Rahul Khanna, role: "Co-founder & CEO", background: "Sales lead at a consumer-lending app for 4 years"}
  - {name: Divya Iyer, role: "Co-founder, Data Science", background: "Built churn and propensity models at a telecom operator"}
  - {name: Aman Gupta, role: "Co-founder & CTO", background: "Backend engineer; built API products at a payments startup"}
problem:
  statement: Lenders reject or overprice borrowers who have no credit history, even when their cash flows show they can repay.
  stats:
    - {claim: "A large share of Indian adults have no usable credit-bureau history", kind: company_estimate}
    - {claim: "Thin-file applicants are rejected 2-3 times more often than borrowers with a bureau score", kind: company_estimate}
    - {claim: "Manual cash-flow underwriting costs lenders Rs 300-600 per small-ticket application", kind: company_estimate}
solution:
  summary: A consent-based score built from alternative data, delivered to lenders through an API with reason codes.
  bullets:
    - "Consented data via Account Aggregator flows and an Android SDK"
    - "Score from 300 to 900 with the top reasons behind each decision"
    - "Model trained on repayment data from partner-lender pilots"
    - "Plugs into a lender's loan-origination system in about two weeks"
market:
  tam: {value: 4200, unit: INR crore, year: 2025, scope: "Credit scoring and underwriting analytics sold to Indian lenders", kind: company_estimate}
  sam: {value: 900, unit: INR crore, year: 2025, scope: "Underwriting tools for thin-file and new-to-credit lending", kind: company_estimate}
  som: {value: 30, unit: INR crore, year: 2029, scope: 3-year obtainable share of SAM, kind: company_forecast}
business_model:
  streams:
    - {name: Lender platform fee, price_inr: 100000, per: month, share_pct: 69, description: Per lender}
    - {name: Score pulls, price_inr: 15, per: transaction, share_pct: 31}
  notes: ["Gross margin 62% after data-access and cloud costs"]
unit_economics:
  cac_inr: 900000
  payback_months: 10
  gross_margin_pct: 62
  other: ["CAC and payback measured per lender", "Model Gini 0.41 on a pilot holdout sample (company-reported, not independently validated)"]
traction:
  as_of: Sep 2026
  customers: 2
  customer_label: paying lenders
  arr: {value: 0.35, unit: INR crore, year: 2026, kind: company_reported}
  series:
    metric: ARR
    unit: INR crore
    points: [{year: 2025, value: 0.08}, {year: 2026, value: 0.35}]
  highlights:
    - "Working with multiple leading bank partners (names under NDA)"
    - "Two paid pilots with small NBFCs"
    - "About 41,000 scores sold since launch"
    - "ARR Rs 0.35 crore (Sep 2026)"
competitors:
  - {name: TransUnion CIBIL, positioning: "Credit bureau; default bureau score for Indian lenders"}
  - {name: Experian India, positioning: "Credit bureau with analytics and decisioning tools"}
  - {name: CreditVidya, positioning: "Alternative-data underwriting for lenders"}
moat:
  - Alternative-data model and early Account Aggregator integrations
gtm:
  channels: [Direct sales to NBFCs and banks, Fintech lending marketplaces]
  target: 10 paying lenders within 18 months
round:
  ask_inr: 100000000
  pre_money_inr: 600000000
  min_raise_pct: 60
  use_of_funds:
    - {category: Data science, pct: 35}
    - {category: Sales, pct: 30}
    - {category: Compliance & security, pct: 20}
    - {category: General & administrative, pct: 15}
  tranches:
    - {pct: 40, title: Round close}
    - {pct: 30, title: First bank contract, criteria: "Signed commercial contract with a scheduled commercial bank, disclosed to investors", due_days: 270}
    - {pct: 30, title: "Rs 2 crore ARR", criteria: "ARR of Rs 2 crore from at least 6 paying lenders", due_days: 540}
risks:
  - Bank partnerships are unnamed and unverified
  - Only two paying customers, both in pilot
  - RBI digital-lending and data-protection rules limit which data can be used
  - Model performance is unproven through a full credit cycle
deck:
