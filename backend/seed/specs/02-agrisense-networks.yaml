schema: aura.seed.startup/v1
slug: agrisense-networks
name: AgriSense Networks
legal_name: AgriSense Networks Private Limited
domain: Agritech
sub_domain: Orchard microclimate and irrigation sensing
stage: seed
hq: {city: Nashik, state: Maharashtra}
founded_year: 2023
one_liner: Solar sensor network that warns apple and grape growers of frost, disease risk and water stress
description: >-
  AgriSense Networks installs solar LoRaWAN sensor nodes in apple and grape orchards and sells a per-sensor
  subscription for frost, disease-risk and irrigation alerts in Marathi, Hindi and English. It has 2,300
  sensors deployed across 210 paying orchards in Nashik (grapes) and Himachal Pradesh (apples), at an ARR
  of Rs 0.4 crore.
founder_account: {email: founder@agrisense-networks.demo, name: Rohan}
mca:
  cin: U01611MH2023PTC398642
  registry:
    status: ACTIVE
    registered_name: AGRISENSE NETWORKS PRIVATE LIMITED
    directors: [Rohan Deshmukh, Pallavi Kulkarni, Tsering Negi]
    incorporation_year: 2023
    state: Maharashtra
team:
  - {name: Rohan Deshmukh, role: "Co-founder & CEO", background: "Grew up on a Nashik grape farm; 6 years selling drip-irrigation systems"}
  - {name: Pallavi Kulkarni, role: "Co-founder & CTO", background: "Embedded-systems engineer; built LoRaWAN gateways for smart water meters"}
  - {name: Tsering Negi, role: "Co-founder, Field Operations (Himachal)", background: "Horticulture graduate; ran orchard advisory for an apple growers' cooperative in Shimla district"}
problem:
  statement: >-
    Apple and grape growers lose crops to frost, fungal disease and badly timed irrigation because they have no
    block-level weather or soil data, only district-level forecasts.
  stats:
    - {claim: "A single spring frost or downy-mildew outbreak can wipe out 20-40% of a block's yield", kind: company_estimate}
    - {claim: "District-level forecasts miss the valley and hill-slope microclimates where frost and disease start", kind: company_estimate}
    - {claim: "Imported orchard weather stations cost Rs 1.5-3 lakh each, out of reach for a 2-5 acre grower", kind: company_estimate}
solution:
  summary: Low-cost solar sensor nodes on a shared LoRaWAN network, plus frost, disease and irrigation alerts priced per sensor.
  bullets:
    - "Rs 6,500 solar sensor node: leaf wetness, canopy temperature, humidity and soil moisture"
    - "One LoRaWAN gateway covers up to 40 orchards within a 3 km radius"
    - "Frost and downy-mildew / apple-scab risk alerts 24-48 hours ahead by SMS and WhatsApp"
    - "Block-wise irrigation schedules in Marathi, Hindi and English"
market:
  tam: {value: 1450, unit: INR crore, year: 2025, scope: "Precision sensing and advisory for India's fruit orchards", kind: company_estimate}
  sam: {value: 210, unit: INR crore, year: 2025, scope: "Grape (Maharashtra) and apple (Himachal Pradesh, J&K) orchards above 2 acres", kind: company_estimate}
  som: {value: 12, unit: INR crore, year: 2028, scope: 3-year obtainable share of SAM, kind: company_forecast}
business_model:
  streams:
    - {name: Sensor node, price_inr: 6500, per: one-time, share_pct: 35, description: "Sold near cost; cooperatives finance it for members"}
    - {name: Alert and advisory subscription, price_inr: 150, per: month, share_pct: 65, description: Billed per sensor}
  notes: ["Subscription gross margin 64%; hardware sold at about 8% margin", "Average orchard runs 11 sensors"]
unit_economics:
  cac_inr: 9800
  payback_months: 9.3
  gross_margin_pct: 52
  monthly_churn_pct: 3.1
  other: ["CAC and payback measured per orchard (about 11 sensors, Rs 1,650 a month)", "Churn peaks after harvest, in the off-season months"]
traction:
