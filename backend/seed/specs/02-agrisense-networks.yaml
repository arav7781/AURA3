    - "ARR Rs 0.4 crore in FY2025, up from Rs 0.1 crore in FY2024"
    - "150 grape orchards in Nashik and 60 apple orchards in Shimla and Kullu districts"
    - "Pilot with one grape exporters' cooperative covering 40 member orchards"
competitors:
  - {name: Fasal, positioning: "IoT sensors + AI advisory for horticulture, premium farms"}
  - {name: Cropin, positioning: "Enterprise agritech SaaS for agribusinesses and exporters"}
  - {name: Imported weather stations, positioning: "Single-point hardware sold through dealers; no local-language advisory"}
moat:
  - Disease-risk models calibrated on two seasons of block-level orchard data
  - Shared LoRaWAN gateways make each extra orchard in a cluster cheap to add
gtm:
  channels: [Grape exporters' cooperatives, Apple growers' associations, Agri-input dealers, Drip-irrigation installers]
  target: 8,000 sensors across 700 orchards within 24 months
round:
