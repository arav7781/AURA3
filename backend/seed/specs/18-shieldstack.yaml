problem:
  statement: >-
    Indian companies must now prove how they collect, use and protect personal data, but most do not know where
    that data sits across their systems.
  stats:
    - {claim: "Penalties under the DPDP Act go up to Rs 250 crore for failing to take reasonable security safeguards against a personal-data breach", source: "Digital Personal Data Protection Act, 2023, Schedule", kind: reported}
    - {claim: "Most mid-size Indian companies have no inventory of where personal data is stored", kind: company_estimate}
    - {claim: "Consultant-led compliance projects cost Rs 25-60 lakh and go stale within months", kind: company_estimate}
solution:
  summary: A compliance platform that finds personal data automatically and keeps DPDP obligations running as workflows.
  bullets:
    - "Automated discovery and classification of personal data across databases, SaaS and cloud storage"
    - "Consent and notice management with an auditable consent ledger"
    - "Data-principal request portal with deadlines and evidence trails"
    - "Breach-response playbooks and notification templates"
