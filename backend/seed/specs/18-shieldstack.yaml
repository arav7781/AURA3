one_liner: "Automates DPDP Act compliance: personal-data discovery, consent records, rights requests and breach workflows"
description: >-
  ShieldStack scans an organisation's databases, SaaS apps and cloud storage to map personal data, then runs
  consent records, data-principal requests (access, correction, erasure) and breach-notification workflows under
  India's Digital Personal Data Protection Act, 2023. It has 34 paying mid-market and enterprise customers in
  BFSI, healthcare and e-commerce, and an ARR of Rs 2.1 crore.
