  highlights:
    - "43,000 acres and 16,800 farmers under MRV"
    - "3 paying carbon project developers"
    - "ARR Rs 0.9 crore in FY2026"
    - "First credit issuance using CarbonKhet MRV expected in 2027"
competitors:
  - {name: Varaha, positioning: "Nature-based carbon project developer in South Asia"}
  - {name: Boomitra, positioning: "Remote-sensing based soil-carbon measurement"}
  - {name: Manual sampling by verifiers, positioning: "Traditional plot-by-plot sampling and lab analysis"}
moat:
  - Calibration dataset linking satellite signals to 9,000 soil samples from Indian farms
  - FPO relationships that bring farmers into projects at low cost
gtm:
  channels: [Carbon project developers, FPO networks, Agri-input companies running sustainability programmes]
  target: 150,000 acres under MRV within 24 months
round:
  ask_inr: 60000000
  pre_money_inr: 340000000
  min_raise_pct: 60
  use_of_funds:
